<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary -->
    <title>GlobalFundConnect — Compare Loans, Cards, Insurance, Savings & More</title>
    <meta name="description" content="GlobalFundConnect is a global financial marketplace to search and compare loans, credit cards, insurance, savings, investments, grants, scholarships and fintech apps from verified providers — with transparent trust scores and AI guidance." />
    <meta name="keywords" content="financial marketplace, compare loans, credit cards, insurance, savings, investments, grants, scholarships, microfinance, fintech, government schemes" />
    <meta name="author" content="GlobalFundConnect" />
    <meta name="robots" content="index, follow" />

    <!-- Icons & theme -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#059669" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="GlobalFundConnect" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GlobalFundConnect — One marketplace for the world's money" />
    <meta property="og:description" content="Compare loans, cards, insurance, savings, investments, grants and more from verified providers — with transparent trust scores and AI guidance." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GlobalFundConnect — The global financial marketplace" />
    <meta name="twitter:description" content="Search and compare financial products worldwide from verified providers." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured data (SEO / rich results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "GlobalFundConnect",
      "description": "A global financial marketplace to compare loans, credit cards, insurance, savings, investments, grants, scholarships and fintech products from verified providers."
    }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Instant-paint shell — shows immediately, React replaces it on mount. -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0b1220;font-family:system-ui,Arial,sans-serif">
        <div style="font-family:'Space Grotesk',system-ui;font-weight:700;font-size:22px;color:#fff">Global<span style="color:#34d399">Fund</span>Connect</div>
        <div style="width:34px;height:34px;border:3px solid rgba(255,255,255,.18);border-top-color:#10b981;border-radius:50%;animation:gfc-spin .8s linear infinite"></div>
      </div>
    </div>
    <style>@keyframes gfc-spin{to{transform:rotate(360deg)}}</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
